# Сёма на VPS: docker compose up -d
# Данные (база, архив писем, вложения) лежат в ./data рядом. Файл запуска
# необязателен: без него Сёма поднимется пустым и покажет мастер настройки.
services:
  sema:
    build: .
    image: sema:latest
    container_name: sema
    restart: unless-stopped
    # без этого Docker бьёт SIGKILL через 10 секунд — Сёма не успевает
    # доделать начатое, закрыть базу начисто и снять замок. Держим заметно
    # больше мягкого срока остановки (`stop.soft_s`, по умолчанию 30 с)
    stop_grace_period: 150s
    volumes:
      # именованный том, не папка хозяина: через bind-mount на маке не работают
      # блокировки SQLite, и база повреждается при любом доступе снаружи
      - sema-data:/data
      # папка хозяина как источник файлов (экран «Хранилища» → наблюдаемые папки):
      # - ~/Inbox:/data/inbox
    ports:
      # наружу не выставляем: сервер слушает только внутри машины,
      # к нему ходят по SSH-туннелю или через обратный прокси с паролем
      - "127.0.0.1:8765:8765"
    environment:
      # часовой пояс Сёма берёт из браузера (app.timezone); задать явно:
      # - TZ=Europe/Berlin
      # модели в своей сети адресуются по имени (контейнер в той же сети
      # докера или машина по имени); SEMA_HOST_ALIAS больше не нужен — он
      # остаётся только для старых настроек с 127.0.0.1
      # ключ шифрования секретов: лежит в .env рядом, а НЕ в томе с данными,
      # иначе резервная копия тома унесёт и базу, и ключ к ней
      - SEMA_KEY=${SEMA_KEY:?задайте SEMA_KEY в .env — им шифруются ключи моделей и пароли ящиков}
      # секреты не в конфиге, а в окружении
      # адреса прослушивания — явно: умолчание обоих портов — петля, а петля
      # внутри контейнера своя, и с неё порт наружу не опубликовать. Кому порт
      # виден снаружи контейнера, решает строка в «ports» выше
      - SEMA_LISTEN=0.0.0.0:8765
      # защищённый порт поднимается, только когда даны сертификат и ключ
      # (SEMA_TLS_CERT, SEMA_TLS_KEY) — тогда же в «ports» нужна строка
      # "127.0.0.1:8443:8443"
      - SEMA_TLS_LISTEN=0.0.0.0:8443
      # Первый вход: браузер хозяина приходит в контейнер из сети моста, а не
      # по петле, поэтому первый ключ заводится кодом первой установки —
      # Сёма печатает его при старте, пока ключей нет: docker logs sema
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sema-data:
