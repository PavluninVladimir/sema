# Файл запуска: только то, что нужно раньше базы. Всё остальное — ящики,
# модели, пороги разбора, категории — настраивается в приложении и живёт в
# базе. Этого файла может не быть совсем: тогда Сёма поднимется пустым и
# покажет мастер первого запуска.

listen: "127.0.0.1:8765"   # адрес; перекрывается SEMA_LISTEN и флагом -listen
# защищённый порт — только когда даны сертификат и ключ; адрес по умолчанию —
# петля, наружу его открывают явно (перекрывается SEMA_TLS_LISTEN). В
# контейнере петля своя: там нужен 0.0.0.0:8443 и публикация порта
# tls:
#   cert: /tls/sema.crt
#   key: /tls/sema.key
#   listen: "127.0.0.1:8443"
data: "."                  # каталог данных: база, вложения, служебные файлы
key_env: SEMA_KEY          # имя переменной окружения с ключом шифрования

# Ниже — необязательная заготовка: при первом запуске она один раз
# переносится в базу и дальше не читается. Удобно, чтобы поднять Сёму на
# новой машине уже с ящиком и моделью; после переноса файл можно удалить.
#
# mail:
#   auth: gmail
#   username: you@example.com
#   google:
#     client_id: XXXX.apps.googleusercontent.com
#     client_secret_env: SEMA_GOOGLE_CLIENT_SECRET
# llm:
#   active: local
#   providers:
#     local:
#       type: openai
#       base_url: http://127.0.0.1:1234/v1
#       model: qwen/qwen3-4b
