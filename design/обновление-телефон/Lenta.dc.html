<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    .э { font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .м { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div class="э" style="width: 390px; height: 844px; background: #FBFAF7; color: #17181C; display: flex; flex-direction: column; overflow: hidden;">

  <!-- шапка разговора: назад, лицо, имя — жест здесь не начинается,
       он живёт только внутри #лента ниже -->
  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #E3E0D8; background: #FBFAF7;">
    <button style="width: 40px; height: 40px; flex: 0 0 40px; border: 0; background: none; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#17181C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
    </button>
    <span style="width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: #2E7D4F; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">И</span>
    <span style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 16px; font-weight: 600;">Иван</span>
      <span style="font-size: 12px; color: #8B8E97;">Telegram</span>
    </span>
  </div>

  <!-- #лента чата: своя прокрутка, у жеста тот же порог (60), но условие
       «в начале» здесь про этот блок, а не про страницу целиком. Посреди
       переписки, где обычно живёт лента, потянуть вниз — обычная
       прокрутка вверх по истории: жест ждёт именно верхней границы -->
  <div style="flex: 1; overflow: hidden; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px;">

    <div style="flex: 0 0 auto; height: 60px; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 10px;">
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E8EDFC; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#1F4FD8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(180deg);"><path d="M8 2.5v9M4 8l4 4 4-4"/></svg>
      </span>
      <span style="font-size: 13px; font-weight: 600; color: #1F4FD8;">Отпустите — обновим</span>
    </div>

    <div style="align-self: flex-start; max-width: 84%; display: flex; flex-direction: column; gap: 3px;">
      <div style="background: #EFEDE6; border-radius: 14px 14px 14px 4px; padding: 9px 12px; font-size: 15px; line-height: 1.4;">Посмотри ещё раз файл #302: это часть договора или отдельное приложение?</div>
      <div style="font-size: 11px; color: #8B8E97; padding-left: 4px;">14:02</div>
    </div>

    <div style="align-self: flex-end; max-width: 84%; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; opacity: 0.55;">
      <div style="background: #E8EDFC; border-radius: 14px 14px 4px 14px; padding: 9px 12px; font-size: 15px; line-height: 1.4; color: #17181C;">Гляну вечером</div>
      <div style="font-size: 11px; color: #8B8E97; padding-right: 4px;">вы · 14:05</div>
    </div>

    <div style="align-self: stretch; margin-top: 4px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #EFECE4; opacity: 0.55;">
      <span style="width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px; background: #E8EDFC; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1F4FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h9v6H5l-3 2.5z"/><path d="M11 6.5h3v6l-2-1.5H7"/></svg>
      </span>
      <span style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15px; font-weight: 600;">Ветка «Сёма»</span>
        <span style="font-size: 13px; color: #585B64; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Не получилось ответить: секретное не отдаётся…</span>
      </span>
    </div>
  </div>

  <div style="flex: 0 0 auto; border-top: 1px solid #E3E0D8; background: #FBFAF7; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end;">
    <div style="flex: 1; min-height: 40px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E0D8; padding: 10px 14px; font-size: 15px; color: #8B8E97;">Написать Ивану…</div>
    <button style="width: 40px; height: 40px; flex: 0 0 40px; border: 0; border-radius: 20px; background: #1F4FD8; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l12-5.5L9 14l-2-5-5-1z"/></svg>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
