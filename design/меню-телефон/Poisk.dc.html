<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F4FD8; } a:hover { color: #17389B; }
    .э { font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .м { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div class="э" style="width: 390px; height: 844px; background: rgba(23, 24, 28, 0.32); color: #17181C; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-size: 15px; line-height: 1.45;">

  <div style="height: 690px; background: #F4F2EC; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 32px rgba(24, 20, 12, 0.18); display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; justify-content: center; padding: 8px 0 4px; flex: 0 0 auto;">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #CFCBC1;"></div>
    </div>

    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px;">
      <div style="width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: #1F4FD8; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">И</div>
      <div style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600;">owner@example.org</div>
      <button style="width: 40px; height: 40px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#585B64" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6"/></svg>
      </button>
    </div>

    <!-- набрано «ключ» -->
    <div style="flex: 0 0 auto; padding: 0 14px 8px;">
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #1F4FD8; padding: 0 12px;">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#1F4FD8" stroke-width="1.5" stroke-linecap="round" style="flex: 0 0 17px;"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4l3.1 3.1"/></svg>
        <span style="font-size: 15px; color: #17181C;">ключ</span>
        <span style="width: 1.5px; height: 20px; background: #1F4FD8; margin-left: 1px;"></span>
        <button style="margin-left: auto; width: 24px; height: 24px; border: 0; border-radius: 12px; background: #EFEDE6; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#585B64" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 4px 14px 10px;">

      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.03em; color: #8B8E97; padding: 8px 10px 6px;">Нашлось · 3</div>

      <!-- найденное показывает путь: где этот раздел живёт -->
      <div style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 10px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(24, 20, 12, 0.07);">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#17181C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 18px;"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6"/></svg>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 16px; font-weight: 600; color: #17181C;">Хранилище секретов</span>
          <span style="font-size: 12px; color: #8B8E97;">Настройки · ключи SSH, токены, пароли</span>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 10px; border-radius: 10px;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8B8E97" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 18px;"><circle cx="8" cy="5.2" r="2.7"/><path d="M2.8 14c0-2.9 2.3-4.6 5.2-4.6s5.2 1.7 5.2 4.6"/></svg>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 16px; color: #585B64;">Доступ</span>
          <span style="font-size: 12px; color: #8B8E97;">Настройки · вход, passkey, токены</span>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 10px; border-radius: 10px;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8B8E97" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 18px;"><path d="M1.5 8.5h3l1.5-4 2.5 8 1.5-4h4.5"/></svg>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 16px; color: #585B64;">Серверы</span>
          <span style="font-size: 12px; color: #8B8E97;">Настройки · ключ у каждого сервера, отпечатки</span>
        </span>
      </div>

      <div style="font-size: 13px; color: #8B8E97; line-height: 1.45; padding: 14px 10px 0;">Ищется по названию раздела, по тому, за что он отвечает, и по словам, которыми его обычно называют.</div>

    </div>
  </div>
</div>
</x-dc>
</body>
